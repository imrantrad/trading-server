# TRD v12.3 — NGINX Configuration
# Production reverse proxy with SSL, rate limiting, security headers

upstream trd_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trd.yourdomain.com;

    # SSL (replace with your cert paths)
    ssl_certificate     /etc/ssl/certs/trd.crt;
    ssl_certificate_key /etc/ssl/private/trd.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # Dashboard (SPA)
    location = / { 
        root /app;
        try_files /dashboard.html =404;
    }
    location ~* \.(html|css|js|png|jpg|ico|woff2)$ {
        root /app;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # API — general rate limit
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://trd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Login — strict rate limit
    location ~ ^/(users/login|auth/google) {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://trd_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://trd_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # All other API endpoints
    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://trd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Block sensitive paths
    location ~ ^/(admin/db|cache/flush|audit/integrity) {
        allow 10.0.0.0/8;    # Internal only
        allow 127.0.0.1;
        deny all;
        proxy_pass http://trd_backend;
    }
}
