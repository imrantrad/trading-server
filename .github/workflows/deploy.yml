name: TRD CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.110.0 uvicorn==0.27.0 pydantic numpy pandas scipy scikit-learn psutil python-multipart bcrypt PyJWT
      
      - name: Compile backend (syntax check)
        run: |
          python -m py_compile backend/main.py
          echo "✅ backend/main.py syntax OK"
          for f in backend/middleware.py backend/db_migrations.py backend/cache_layer.py backend/background_tasks.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f" && echo "✅ $f syntax OK"
            fi
          done
      
      - name: Validate dashboard
        run: |
          test -f dashboard.html
          SIZE=$(wc -c < dashboard.html)
          echo "Dashboard size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Dashboard too small ($SIZE bytes)"
            exit 1
          fi
          if [ "$SIZE" -gt 1000000 ]; then
            echo "ERROR: Dashboard too large ($SIZE bytes) - possible duplicate"
            exit 1
          fi
          echo "✅ Dashboard size OK"
      
      - name: Summary
        if: success()
        run: |
          echo "## ✅ CI/CD Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend Python files compile" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dashboard HTML size validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Ready for deployment" >> $GITHUB_STEP_SUMMARY
