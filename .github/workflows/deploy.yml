name: TRD CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic numpy pandas scipy scikit-learn psutil python-multipart bcrypt PyJWT
      
      - name: Compile backend
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/middleware.py || echo "middleware not present"
          python -m py_compile backend/db_migrations.py || echo "db_migrations not present"
          python -m py_compile backend/cache_layer.py || echo "cache_layer not present"
          echo "✅ Backend compiled successfully"
      
      - name: Test imports
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '..')
          sys.path.insert(0, '.')
          import main
          print('✅ main.py imports OK')
          print('   Title:', main.app.title)
          routes = [r for r in main.app.routes if hasattr(r, 'path')]
          print('   Routes:', len(routes))
          "
      
      - name: Validate dashboard
        run: |
          test -f dashboard.html
          SIZE=$(wc -c < dashboard.html)
          echo "✅ Dashboard.html: $SIZE bytes"
          test $SIZE -gt 100000 || (echo "❌ Dashboard too small!" && exit 1)
          test $SIZE -lt 1000000 || (echo "❌ Dashboard too large (possible duplicate)" && exit 1)
      
      - name: Summary
        run: |
          echo "## ✅ CI/CD Pipeline Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend compiled" >> $GITHUB_STEP_SUMMARY
          echo "- Imports validated" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard size OK" >> $GITHUB_STEP_SUMMARY
